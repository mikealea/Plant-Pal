<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Pal - AI Plant Identifier</title>
    <!-- Added plugins=typography to enable prose classes for Markdown styling -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f5f5f4; /* stone-100 */
        border-radius: 4px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: #292524; /* stone-800 */
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1; /* stone-300 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #57534e; /* stone-600 */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e; /* stone-400 */
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #78716c; /* stone-500 */
      }

      .animate-scan {
        animation: scan 2s linear infinite;
      }
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* Logo Animation */
      .animate-logo-entry {
        animation: pop-in-rotate 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes pop-in-rotate {
        0% {
          opacity: 0;
          transform: scale(0) rotate(-180deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
  <body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 min-h-screen transition-colors duration-300">
    <div id="root"></div>
  </body>
</html>
